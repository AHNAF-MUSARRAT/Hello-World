<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Filter Studio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="main-card mx-auto">

        <h1 class="text-center mb-3">
            📷 Webcam Filter Studio
        </h1>

        <p class="text-center mb-4">
            Select a filter and watch it apply instantly.
        </p>

        <div class="text-center mb-4">

            <button class="btn btn-primary filter-btn active" data-filter="none">Normal</button>

            <button class="btn btn-secondary filter-btn" data-filter="grayscale">Gray</button>

            <button class="btn btn-danger filter-btn" data-filter="sepia">Sepia</button>

            <button class="btn btn-warning filter-btn" data-filter="invert">Invert</button>

            <button class="btn btn-success filter-btn" data-filter="blur">Blur</button>

            <button class="btn btn-info filter-btn" data-filter="brightness">Bright</button>

            <button class="btn btn-dark filter-btn" data-filter="contrast">Contrast</button>

            <button class="btn btn-light filter-btn" data-filter="hue">Hue</button>

        </div>

        <div class="canvas-box">

            <canvas id="canvas"></canvas>

            <span id="currentFilter">
                Current Filter : Normal
            </span>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
