<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech to Text App</title>
    <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2, #ff6b6b);
}

.container {
  width: 90%;
  max-width: 700px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  text-align: center;
}

h1 {
  margin-bottom: 20px;
  color: #333;
}

p {
  color: #666;
  margin-bottom: 20px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #667eea, #764ba2);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

textarea {
  width: 100%;
  height: 220px;
  margin-top: 20px;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  resize: none;
  font-size: 16px;
}

.status {
  margin-top: 15px;
  font-weight: bold;
  color: #764ba2;
}
 
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎤 Speech to Text Converter</h1>
      <p>Click the button and start speaking.</p>

      <button onclick="startRecognition()">Start Listening</button>

      <div class="status" id="status">Ready</div>

      <textarea
        id="output"
        placeholder="Your speech will appear here..."
      ></textarea>
    </div>

    <script>
    const output = document.getElementById("output");
const statusText = document.getElementById("status");

function startRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech Recognition is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.start();
  statusText.innerHTML = "🎙 Listening...";

  recognition.onresult = function (event) {
    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    output.value = transcript;
  };

  recognition.onend = function () {
    statusText.innerHTML = "Stopped Listening";
  };

  recognition.onerror = function () {
    statusText.innerHTML = "Error Occurred";
  };
}

    </script>
  </body>
</html>
