<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Recognition</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/defbdbe434.js"
      crossorigin="anonymous"
    ></script>

    <!-- ML5 -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <!-- WebcamJS -->
    <script src="https://cdn.jsdelivr.net/npm/webcamjs@1.0.26/webcam.min.js"></script>

  <style>
   body {
  font-family: "Poppins", sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
}

.title {
  font-size: 3rem;
  font-weight: 600;
}

.subtitle {
  font-size: 1.1rem;
  margin-bottom: 30px;
}

.camera-box {
  width: 350px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
}

#camera {
  width: 350px;
  height: 300px;
}

#result img {
  border-radius: 20px;
  margin-top: 20px;
  width: 350px;
}

.prediction-card {
  background: white;
  color: #333;
  padding: 20px;
  border-radius: 20px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}
 
  </style>
  </head>
  <body>
    <div class="container text-center py-5">
      <h1 class="title">
        <i class="fas fa-robot"></i>
        AI Image Recognition
      </h1>

      <p class="subtitle">Capture an image and let AI identify it.</p>

      <div class="camera-box mx-auto">
        <div id="camera"></div>
      </div>

      <button class="btn btn-primary mt-3" onclick="takeSnapshot()">
        <i class="fas fa-camera"></i> Capture Image
      </button>

      <div id="result" class="mt-4"></div>

      <div class="prediction-card mt-4">
        <h4>Prediction</h4>
        <p id="objectName">Waiting...</p>
        <p id="confidence">Confidence: --</p>
      </div>
    </div>

    <script>
      // ======================================
// AI Image Recognition using ML5.js
// Teachable Machine Model
// ======================================

// Load the trained Teachable Machine model
let classifier = ml5.imageClassifier(
  "https://teachablemachine.withgoogle.com/models/WtadlvMro/model.json",
  modelLoaded,
);

// Runs after the model loads successfully
function modelLoaded() {
  console.log("✅ AI Model Loaded Successfully!");
}

// Configure the webcam
Webcam.set({
  width: 350,
  height: 300,
  image_format: "png",
  png_quality: 90,
});

// Attach the webcam to the HTML div
Webcam.attach("#camera");

// Capture an image
function takeSnapshot() {
  Webcam.snap(function (data_uri) {
    // Show the captured image
    document.getElementById("result").innerHTML =
      `<img id="capturedImage" src="${data_uri}" class="img-fluid rounded shadow">`;

    // Automatically recognize the image
    classifyImage();
  });
}

// Classify the captured image
function classifyImage() {
  const image = document.getElementById("capturedImage");

  if (!image) {
    alert("Please capture an image first!");
    return;
  }

  classifier.classify(image, gotResult);
}

// Display prediction
function gotResult(error, results) {
  if (error) {
    console.error(error);
    alert("Something went wrong while recognizing the image.");
    return;
  }

  // Display the predicted object
  document.getElementById("objectName").innerHTML = results[0].label;

  // Display confidence score
  document.getElementById("confidence").innerHTML =
    "Confidence: " + (results[0].confidence * 100).toFixed(2) + "%";

  console.log(results);
}

    </script>
  </body>
</html>
