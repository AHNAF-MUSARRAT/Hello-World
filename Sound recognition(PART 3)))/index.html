<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Car Exhaust Sound Detector</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">🏎 AI Car Exhaust Detector</h1>
        <p class="lead">
          Detect supercar exhaust sounds using Artificial Intelligence.
        </p>

        <button class="btn btn-danger btn-lg px-5 mt-3" onclick="start()">
          🎤 Start Listening
        </button>
      </div>

      <div class="card shadow p-4 text-center mb-5">
        <h3>Detected Car</h3>

        <h2 id="result-label">Waiting...</h2>

        <h5 id="result-confidence">Confidence: --</h5>
      </div>

      <div class="row g-4">
        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://www.bing.com/th/id/OIP.O5iZTwu8h4w44V-FNR-W9AHaE8?w=211&h=128&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2"
              id="lamborghini"
              class="car-img"
            />
            <h5 class="mt-3">Lamborghini Aventador</h5>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://www.bing.com/th/id/OIP.6JKXhpWWtvBtuOS1nJ-nwgHaE8?w=189&h=128&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2"
              id="ferrari"
              class="car-img"
            />
            <h5 class="mt-3">Ferrari 488</h5>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://www.exoticcarhacks.com/wp-content/uploads/2024/07/Used-2021-Nissan-GT-R-Premium-T-SPEC-in-Millenium-Jade-w-Delivery-Miles-1701298714.jpg"
              id="gtr"
              class="car-img"
            />
            <h5 class="mt-3">Nissan GT-R R35</h5>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://m3list.com/wp-content/uploads/2024/08/ADRO-widebody-bmw-g82-m4-for-sale-matte-black-modified-BMW-M4-M3List-for-sale-e1723248692591.jpg"
              id="bmw"
              class="car-img"
            />
            <h5 class="mt-3">BMW M4</h5>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://tse4.mm.bing.net/th/id/OIP._o-keDyk-CyW5N4MGaoM2wHaEK?r=0&w=1920&h=1080&rs=1&pid=ImgDetMain&o=7&rm=3"
              id="supra"
              class="car-img"
            />
            <h5 class="mt-3">Toyota Supra MK4</h5>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="car-card text-center">
            <img
              src="https://4kwallpapers.com/images/wallpapers/porsche-911-gt3-rs-2560x1440-12365.jpg"
              id="porsche"
              class="car-img"
            />
            <h5 class="mt-3">Porsche 911 GT3</h5>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
