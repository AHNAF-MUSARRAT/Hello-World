<!-- HW-REGISTRATION FORM -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YourEvent - Online Registration</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f5;
        margin: 0;
        padding: 0;
      }

      .container {
        width: 60%;
        margin: 50px auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .logo {
        text-align: center;
        color: #2e9e6f;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .title {
        background-color: #c4c3c6;
        text-align: center;
        padding: 15px;
        font-size: 22px;
        border-radius: 5px;
        margin-bottom: 30px;
      }

      .row {
        display: flex;
        gap: 20px;
      }

      .form-group {
        margin-bottom: 20px;
        width: 100%;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: #2e9e6f;
        outline: none;
      }

      .dob-row {
        display: flex;
        gap: 15px;
      }

      button {
        width: 100%;
        padding: 14px;
        background-color: #2e9e6f;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #247a57;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🏅 YourEvent</div>
      <div class="title">Online Registration</div>

      <form>
        <div class="row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="First Name" />
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Last Name" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="Email Address" />
        </div>

        <div class="form-group">
          <label>Company (if applicable)</label>
          <input type="text" placeholder="Company" />
        </div>

        <div class="form-group">
          <label>Physical Address</label>
          <input type="text" placeholder="Physical Address" />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <div class="dob-row">
            <select>
              <option>Month</option>
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>

            <select>
              <option>Day</option>
              <!-- You can add 1–31 -->
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
            </select>

            <select>
              <option>Year</option>
              <option>2026</option>
              <option>2025</option>
              <option>2024</option>
              <option>2023</option>
            </select>
          </div>
        </div>

        <button type="submit">Register</button>
      </form>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">

        <label>Student ID</label> <br />

        <br />
        <br />
        <button>Submit</button>
      </form>
    </div>

</html>
