<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Guesser AI</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ML5 -->
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <!-- P5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="title">🎨 Sketch Guesser AI</h1>
        <p class="subtitle">
            Draw any object and let Artificial Intelligence guess it.
        </p>
    </div>

    <div class="main-card mx-auto">

        <div id="canvas-container"></div>

        <div class="result-box">

            <div class="row text-center">

                <div class="col-6">
                    <h5>Prediction</h5>
                    <h4 id="label">Waiting...</h4>
                </div>

                <div class="col-6">
                    <h5>Confidence</h5>
                    <h4 id="accuracy">--%</h4>
                </div>

            </div>

        </div>

        <div class="text-center mt-4">
            <button class="btn btn-danger btn-lg px-5" onclick="clearCanvas()">
                🗑 Clear Canvas
            </button>
        </div>

    </div>

</div>

<footer class="text-center mt-5">
    <small>Made with ML5.js & DoodleNet</small>
</footer>

<script src="script.js"></script>

</body>

</html>
